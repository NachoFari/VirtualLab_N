<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cámara AR HD | VirtualLab_N</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; background: #000; }
    
    .ar-ui-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 99999;
      display: flex; flex-direction: column; justify-content: space-between; padding: 0.8rem;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
    }
    .badge {
      background: rgba(15, 20, 28, 0.9); border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      padding: 0.4rem 0.8rem; border-radius: 20px; backdrop-filter: blur(8px);
    }
    .btn-marker-help {
      background: rgba(0, 242, 254, 0.15); border: 1px solid #00f2fe; color: #00f2fe;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
      padding: 0.4rem 0.8rem; border-radius: 20px; text-decoration: none; pointer-events: auto;
    }
    
    /* Retícula de Enfoque Visual */
    .focus-reticle {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.4);
      width: 120px; height: 120px; border: 2px dashed #00f2fe; border-radius: 16px;
      pointer-events: none; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); z-index: 99998;
    }
    .focus-reticle.active {
      opacity: 1; transform: translate(-50%, -50%) scale(1.0);
    }

    /* Toast con desaparición suave automática */
    .status-toast {
      align-self: center; background: rgba(7, 9, 14, 0.92); border: 1px solid #00f2fe;
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      padding: 0.45rem 1.1rem; border-radius: 20px; box-shadow: 0 0 15px rgba(0,242,254,0.3);
      text-align: center; transition: opacity 0.5s ease; pointer-events: none;
    }

    .bottom-hud {
      background: rgba(15, 20, 28, 0.92); border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 14px; padding: 0.75rem 1rem; backdrop-filter: blur(10px);
      display: flex; flex-direction: column; gap: 0.35rem; pointer-events: auto;
    }
    .hud-line {
      display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #fff;
    }
    .hud-line span:last-child { color: #00f2fe; font-weight: 700; }
  </style>

  <!-- Auto Cache-Buster Revision 15 -->
  <script>
    const CURRENT_REV = "rev15_hdcam_permissive_lerp";
    if (new URLSearchParams(window.location.search).get("v") !== CURRENT_REV) {
      window.location.replace("alumno.html?v=" + CURRENT_REV);
    }
  </script>
</head>
<body>

  <!-- Retícula de Enfoque en Pantalla -->
  <div class="focus-reticle" id="focus-reticle"></div>

  <!-- UI FLOTANTE -->
  <div class="ar-ui-container">
    <div class="top-bar">
      <div class="badge">VLAB_N • HD CALIBRADO V15</div>
      <div style="display:flex; gap:0.35rem;">
        <button class="btn-marker-help" id="btn-orient-toggle" style="cursor:pointer; background:rgba(0,242,254,0.25);">🖥️ Mesa</button>
        <button class="btn-marker-help" id="btn-focus-top" style="cursor:pointer; background:rgba(0,242,254,0.2);">🎯 Enfocar</button>
        <a href="marcador.html" target="_blank" class="btn-marker-help">📄 Diana</a>
      </div>
    </div>

    <div class="status-toast" id="tracking-status">
      🔍 Apunta la cámara a la Diana Natex o Hiro
    </div>

    <div class="bottom-hud">
      <div class="hud-line"><span>Anclaje Diana:</span> <span id="ar-track">Buscando Diana...</span></div>
      <div class="hud-line"><span>Estabilidad:</span> <span id="ar-stability" style="color:#10b981;">Filtro LERP + Sensor Activo</span></div>
      <div class="hud-line"><span>Proyección:</span> <span id="ar-orient-val">Mesa (Horizontal)</span></div>
      <div class="hud-line"><span>Longitud (L):</span> <span id="ar-l">0.70 m</span></div>
      <div class="hud-line"><span>Ángulo (&theta;):</span> <span id="ar-angle">25.0°</span></div>
    </div>
  </div>

  <!-- ESCENA AR ULTRA-HD CON ALTA SENSIBILIDAD -->
  <a-scene embedded 
           arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best; maxDetectionRate: 60; patternRatio: 0.5;">
    
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2;"></a-entity>
    <a-entity light="type: directional; color: #00f2fe; intensity: 1.5; position: 1 3 2;"></a-entity>

    <!-- 1. DIANA OFICIAL NATEX (Baja tolerancia: minConfidence 0.1 para detección instantánea) -->
    <a-marker type="pattern" preset="custom" url="./pattern-natex.patt" patternRatio="0.5" 
              minConfidence="0.1" emitsEvents="true" smooth="true" smoothCount="8" 
              smoothTolerance="0.01" smoothThreshold="3" id="natex-target">
      <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="0.35" radius-outer="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.8;"></a-ring>
    </a-marker>

    <!-- 2. FALLBACK UNIVERSAL HIRO (minConfidence 0.1) -->
    <a-marker preset="hiro" minConfidence="0.1" emitsEvents="true" smooth="true" 
              smoothCount="8" smoothTolerance="0.01" smoothThreshold="3" id="hiro-target">
      <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="0.35" radius-outer="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.8;"></a-ring>
    </a-marker>

    <!-- ANCLADO ULTRA-ESTABLE FILTRADO CON LERP/SLERP Y PERSISTENCIA -->
    <a-entity id="stabilized-anchor" visible="false">
      <a-entity id="apparatus-container" position="0 0 0" rotation="0 0 0" scale="0.45 0.45 0.45">
        <!-- Base de Soporte -->
        <a-box id="base-plate" position="0 0.03 0" width="0.7" height="0.06" depth="0.4" color="#0f141c" material="metalness: 0.8; roughness: 0.2;"></a-box>
        <a-box position="0 0.03 0" width="0.72" height="0.015" depth="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.6;"></a-box>

        <!-- Mástil Vertical al Fondo (Z = -0.20) -->
        <a-cylinder id="stand-mast" position="0 0.5 -0.2" radius="0.025" height="1.0" color="#94a3b8" material="metalness: 0.9; roughness: 0.1;"></a-cylinder>

        <!-- Mordaza y Brazo Horizontal hacia el frente -->
        <a-box id="stand-clamp" position="0 1.0 -0.2" width="0.08" height="0.08" depth="0.08" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.5;"></a-box>
        <a-cylinder id="stand-arm" position="0 1.0 -0.1" rotation="90 0 0" radius="0.018" height="0.22" color="#94a3b8"></a-cylinder>

        <!-- PIVOTE Y PÉNDULO (Oscilación lateral izquierda-derecha) -->
        <a-entity id="pendulum-pivot" position="0 1.0 0">
          <a-cylinder id="pendulum-rod" position="0 -0.35 0" radius="0.012" height="0.7" color="#ffffff"></a-cylinder>
          <a-sphere id="pendulum-bob" position="0 -0.7 0" radius="0.15" color="#00f2fe" material="metalness: 0.3; roughness: 0.1; emissive: #00f2fe; emissiveIntensity: 0.85;"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ELEMENTOS DEL DOM Y ESCENA 3D
    const stabilizedAnchor = document.getElementById('stabilized-anchor');
    const apparatusContainer = document.getElementById('apparatus-container');
    const standMast = document.getElementById('stand-mast');
    const standClamp = document.getElementById('stand-clamp');
    const standArm = document.getElementById('stand-arm');
    const pendulumPivot = document.getElementById('pendulum-pivot');
    const pendulumRod = document.getElementById('pendulum-rod');
    const pendulumBob = document.getElementById('pendulum-bob');

    const natexMarker = document.getElementById('natex-target');
    const hiroMarker = document.getElementById('hiro-target');
    const trackStatus = document.getElementById('tracking-status');
    const arTrackText = document.getElementById('ar-track');

    // Desaparición Automática del Texto de Alerta tras 2.5 Segundos
    let toastTimer = null;
    function onMarkerDetected(name) {
      clearTimeout(toastTimer);
      trackStatus.style.display = "block";
      trackStatus.style.opacity = "1";
      trackStatus.innerText = "🎯 ¡" + name + " Detectado! Anclado en 3D";
      trackStatus.style.borderColor = "#10b981";
      trackStatus.style.color = "#10b981";
      arTrackText.innerText = "ANCLADO EN 3D";
      arTrackText.style.color = "#10b981";

      toastTimer = setTimeout(() => {
        trackStatus.style.opacity = "0";
        setTimeout(() => { trackStatus.style.display = "none"; }, 500);
      }, 2500);
    }

    function onMarkerLost() {
      clearTimeout(toastTimer);
      trackStatus.style.display = "block";
      trackStatus.style.opacity = "1";
      trackStatus.innerText = "🔍 Apunta la cámara a la Diana Natex o Hiro";
      trackStatus.style.borderColor = "#00f2fe";
      trackStatus.style.color = "#00f2fe";
      arTrackText.innerText = "Buscando Diana...";
      arTrackText.style.color = "#00f2fe";
    }

    // FÍSICA AUTÓNOMA DETERMINISTA Y SINCRONIZACIÓN POR EVENTOS
    const myClientId = 'student_' + Math.random().toString(36).substring(2, 9);
    let state = { theta: Math.PI / 5, omega: 0.0 };
    let params = { length: 0.7, gravity: 9.8, friction: 0.03, paused: false };

    // Toast flotante dinámico
    function flashStatus(text) {
      clearTimeout(toastTimer);
      trackStatus.style.display = "block";
      trackStatus.style.opacity = "1";
      trackStatus.innerText = text;
      trackStatus.style.borderColor = "#00f2fe";
      trackStatus.style.color = "#00f2fe";
      toastTimer = setTimeout(() => {
        trackStatus.style.opacity = "0";
        setTimeout(() => { trackStatus.style.display = "none"; }, 500);
      }, 2000);
    }

    // CONTROL DE ALTA RESOLUCIÓN Y ENFOQUE CONTINUO DE CÁMARA (W3C MediaStreamTrack)
    let currentVideoTrack = null;
    function setupCameraHD() {
      let attempts = 0;
      const checkVideo = setInterval(() => {
        attempts++;
        const video = document.getElementById('arjs-video') || document.querySelector('video');
        if (video && video.srcObject) {
          const stream = video.srcObject;
          const tracks = stream.getVideoTracks();
          if (tracks.length > 0) {
            currentVideoTrack = tracks[0];
            clearInterval(checkVideo);
            applyCameraHDConstraints();
          }
        }
        if (attempts > 30) clearInterval(checkVideo);
      }, 400);
    }

    function applyCameraHDConstraints() {
      if (!currentVideoTrack || !currentVideoTrack.applyConstraints) return;
      try {
        const caps = currentVideoTrack.getCapabilities ? currentVideoTrack.getCapabilities() : {};
        const adv = {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          adv.focusMode = 'continuous';
        }
        if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
          adv.exposureMode = 'continuous';
        }
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) {
          adv.whiteBalanceMode = 'continuous';
        }

        const constraints = {
          width: { ideal: 1920, min: 1280 },
          height: { ideal: 1080, min: 720 }
        };
        if (Object.keys(adv).length > 0) {
          constraints.advanced = [adv];
        }

        currentVideoTrack.applyConstraints(constraints)
          .then(() => console.log("Cámara: Calidad HD y autoenfoque continuo activados"))
          .catch(() => {});
      } catch (e) {}
    }

    // Forzar barrido de enfoque sobre el símbolo
    function triggerCameraRefocus() {
      const reticle = document.getElementById('focus-reticle');
      if (reticle) {
        reticle.classList.add('active');
        setTimeout(() => reticle.classList.remove('active'), 750);
      }
      if (navigator.vibrate) navigator.vibrate(40);

      if (currentVideoTrack && currentVideoTrack.applyConstraints) {
        try {
          const caps = currentVideoTrack.getCapabilities ? currentVideoTrack.getCapabilities() : {};
          if (caps.focusMode) {
            if (caps.focusMode.includes('single-shot')) {
              currentVideoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] })
                .then(() => {
                  setTimeout(() => {
                    if (caps.focusMode.includes('continuous')) {
                      currentVideoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                  }, 600);
                }).catch(() => {});
            } else if (caps.focusMode.includes('continuous')) {
              currentVideoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            }
          }
        } catch (e) {}
      }

      flashStatus("🎯 Re-enfocando cámara en alta definición...");
    }

    document.getElementById('btn-focus-top').onclick = (e) => {
      e.stopPropagation();
      triggerCameraRefocus();
    };

    window.addEventListener('load', setupCameraHD);

    // GIROSCOPIO Y SENSORES
    let gyroActive = false;
    function initGyro() {
      if (gyroActive) return;
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(r => {
            if (r === 'granted') {
              gyroActive = true;
            }
          }).catch(() => {});
        } else {
          gyroActive = true;
        }
      }
    }

    // Al tocar la pantalla: enfocar cámara e inicializar sensores
    window.addEventListener('click', (e) => {
      if (!e.target.closest('button') && !e.target.closest('a')) {
        initGyro();
        triggerCameraRefocus();
      }
    });

    // Orientación de Proyección (Mesa horizontal vs Pared/Monitor vertical)
    let currentOrientation = 'desk';
    function applyOrientation(mode) {
      currentOrientation = mode;
      const rot = (mode === 'wall') ? "-90 0 0" : "0 0 0";
      if (apparatusContainer) apparatusContainer.setAttribute('rotation', rot);

      const btn = document.getElementById('btn-orient-toggle');
      if (btn) btn.innerText = (mode === 'wall') ? "🧱 Pared" : "🖥️ Mesa";
      const lbl = document.getElementById('ar-orient-val');
      if (lbl) lbl.innerText = (mode === 'wall') ? "Pared / Monitor" : "Mesa (Horizontal)";
    }

    document.getElementById('btn-orient-toggle').onclick = (e) => {
      e.stopPropagation();
      applyOrientation(currentOrientation === 'desk' ? 'wall' : 'desk');
      flashStatus("Proyección: " + (currentOrientation === 'wall' ? "Pared / Monitor" : "Mesa"));
    };

    // Sincronización MQTT por Eventos con el Profesor
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });
    client.on('connect', () => {
      client.subscribe("vlab-n/sala-natex");
    });

    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());
        
        if (payload.type === 'PARAM_CHANGE' || payload.type === 'SYNC') {
          if (payload.length !== undefined) params.length = payload.length;
          if (payload.gravity !== undefined) params.gravity = payload.gravity;
          if (payload.friction !== undefined) params.friction = payload.friction;
          if (payload.paused !== undefined) params.paused = payload.paused;

          if (payload.orientation && payload.orientation !== currentOrientation) {
            applyOrientation(payload.orientation);
          }

          if (payload.action === 'RESET' || payload.action === 'PUSH' || payload.action === 'STEP' || payload.action === 'SYNC_ALL' || payload.action === 'INIT') {
            if (payload.theta !== undefined) state.theta = payload.theta;
            if (payload.omega !== undefined) state.omega = payload.omega;
          }

          let deg = state.theta * 180 / Math.PI;
          updateVisuals(deg, params.length);

          if (payload.action === 'PUSH') {
            flashStatus("⚡ ¡Empujón del Docente!");
          } else if (payload.action !== 'INIT') {
            flashStatus("⚡ Docente actualizó parámetros físicos");
          }
        }
      } catch (e) {}
    });

    function updateVisuals(deg, len) {
      // Ajuste telescópico dinámico: la altura del soporte crece con la longitud
      // dejando un margen de seguridad de 0.35m sobre la base para que nunca la atraviese
      const H = len + 0.35;

      // 1. Mástil Vertical al fondo (Z = -0.2)
      standMast.setAttribute('height', H);
      standMast.setAttribute('position', `0 ${H / 2} -0.2`);

      // 2. Mordaza y Brazo Horizontal hacia el frente
      standClamp.setAttribute('position', `0 ${H} -0.2`);
      standArm.setAttribute('position', `0 ${H} -0.1`);

      // 3. Pivote en el extremo del brazo
      pendulumPivot.setAttribute('position', `0 ${H} 0`);
      pendulumPivot.setAttribute('rotation', `0 0 ${deg}`);

      // 4. Cuerda y Esfera
      pendulumRod.setAttribute('height', len);
      pendulumRod.setAttribute('position', `0 ${-len / 2} 0`);
      pendulumBob.setAttribute('position', `0 ${-len} 0`);

      document.getElementById('ar-l').innerText = len.toFixed(2) + ' m';
      document.getElementById('ar-angle').innerText = deg.toFixed(1) + '°';
    }

    // VARIABLES DE SUAVIZADO LERP/SLERP Y PERSISTENCIA
    let activeMarkerObj = null;
    let lastSeenTime = 0;
    const GRACE_PERIOD_MS = 600; // 600ms de persistencia para eliminar todo parpadeo
    const currentPos = new THREE.Vector3();
    const targetPos = new THREE.Vector3();
    const currentQuat = new THREE.Quaternion();
    const targetQuat = new THREE.Quaternion();
    let isPoseInitialized = false;

    natexMarker.addEventListener('markerFound', () => {
      activeMarkerObj = natexMarker.object3D;
      onMarkerDetected("Diana Natex");
    });
    hiroMarker.addEventListener('markerFound', () => {
      activeMarkerObj = hiroMarker.object3D;
      onMarkerDetected("Marcador Hiro");
    });

    // Bucle de Renderizado y Física RK4 (60 FPS puros)
    let lastT = performance.now();
    function tick() {
      requestAnimationFrame(tick);
      let now = performance.now();
      let dt = (now - lastT) / 1000;
      lastT = now;
      if (dt > 0.1) dt = 0.1;

      // GESTIÓN DE POSE SUAVIZADA (LERP / SLERP + PERSISTENCIA)
      let isVisibleNow = false;
      if (natexMarker.object3D && natexMarker.object3D.visible) {
        activeMarkerObj = natexMarker.object3D;
        isVisibleNow = true;
      } else if (hiroMarker.object3D && hiroMarker.object3D.visible) {
        activeMarkerObj = hiroMarker.object3D;
        isVisibleNow = true;
      }

      if (isVisibleNow && activeMarkerObj) {
        lastSeenTime = now;
        targetPos.copy(activeMarkerObj.position);
        targetQuat.copy(activeMarkerObj.quaternion);

        if (!isPoseInitialized) {
          currentPos.copy(targetPos);
          currentQuat.copy(targetQuat);
          isPoseInitialized = true;
        } else {
          // Filtro de amortiguamiento LERP/SLERP a 0.22 (elimina el temblor de mano)
          currentPos.lerp(targetPos, 0.22);
          currentQuat.slerp(targetQuat, 0.22);
        }

        stabilizedAnchor.object3D.position.copy(currentPos);
        stabilizedAnchor.object3D.quaternion.copy(currentQuat);
        stabilizedAnchor.setAttribute('visible', true);
      } else {
        // Si se perdió momentáneamente la visión óptica (por sombra o giro leve), sostener pose
        if (now - lastSeenTime < GRACE_PERIOD_MS && isPoseInitialized) {
          stabilizedAnchor.setAttribute('visible', true);
        } else {
          if (stabilizedAnchor.getAttribute('visible') !== false) {
            stabilizedAnchor.setAttribute('visible', false);
            onMarkerLost();
          }
        }
      }

      // FÍSICA RK4 DETERMINISTA
      if (!params.paused) {
        let gL = params.gravity / Math.max(0.2, params.length);
        let k1_th = state.omega;
        let k1_om = -gL * Math.sin(state.theta) - params.friction * state.omega;
        let k2_th = state.omega + 0.5 * dt * k1_om;
        let k2_om = -gL * Math.sin(state.theta + 0.5 * dt * k1_th) - params.friction * (state.omega + 0.5 * dt * k1_om);
        state.theta += dt * k2_th;
        state.omega += dt * k2_om;

        let deg = state.theta * 180 / Math.PI;
        updateVisuals(deg, params.length);
      }
    }

    // Inicialización al cargar
    updateVisuals(state.theta * 180 / Math.PI, params.length);
    applyOrientation('desk');
    requestAnimationFrame(tick);
  </script>
</body>
</html>
