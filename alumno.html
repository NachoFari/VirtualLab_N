<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cámara AR Instant-Lock | VirtualLab_N</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; background: #000; }
    
    /* Overlay 2D de detección láser de cuadrados en tiempo real */
    #quad-overlay {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 99997;
    }

    .ar-ui-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 99999;
      display: flex; flex-direction: column; justify-content: space-between; padding: 0.75rem;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
      gap: 0.4rem; flex-wrap: wrap;
    }
    .badge {
      background: rgba(15, 20, 28, 0.92); border: 1px solid rgba(0, 242, 254, 0.5);
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      padding: 0.38rem 0.75rem; border-radius: 20px; backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #00f2fe;
      box-shadow: 0 0 8px #00f2fe; display: inline-block;
    }
    .pulse-dot.locked {
      background: #10b981; box-shadow: 0 0 10px #10b981;
    }
    .btn-marker-help {
      background: rgba(0, 242, 254, 0.15); border: 1px solid #00f2fe; color: #00f2fe;
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700;
      padding: 0.38rem 0.7rem; border-radius: 20px; text-decoration: none; pointer-events: auto;
    }
    
    /* Retícula de Enfoque Visual */
    .focus-reticle {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.4);
      width: 120px; height: 120px; border: 2px dashed #00f2fe; border-radius: 16px;
      pointer-events: none; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); z-index: 99998;
    }
    .focus-reticle.active {
      opacity: 1; transform: translate(-50%, -50%) scale(1.0);
    }

    /* Toast con desaparición suave automática */
    .status-toast {
      align-self: center; background: rgba(7, 9, 14, 0.92); border: 1px solid #00f2fe;
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      padding: 0.45rem 1.1rem; border-radius: 20px; box-shadow: 0 0 15px rgba(0,242,254,0.3);
      text-align: center; transition: opacity 0.4s ease; pointer-events: none;
    }

    .bottom-hud {
      background: rgba(15, 20, 28, 0.92); border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 14px; padding: 0.7rem 0.95rem; backdrop-filter: blur(10px);
      display: flex; flex-direction: column; gap: 0.32rem; pointer-events: auto;
    }
    .hud-line {
      display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: #fff;
    }
    .hud-line span:last-child { color: #00f2fe; font-weight: 700; }
  </style>

  <!-- Auto Cache-Buster Revision 16 (Motor Instant-Square-Lock 4:3 + Multi-Threshold) -->
  <script>
    const CURRENT_REV = "rev16_instant_square_lock";
    if (new URLSearchParams(window.location.search).get("v") !== CURRENT_REV) {
      window.location.replace("alumno.html?v=" + CURRENT_REV);
    }
  </script>
</head>
<body>

  <!-- Canvas de Detección Óptica de Cuadrados en Vivo -->
  <canvas id="quad-overlay"></canvas>

  <!-- Retícula de Enfoque en Pantalla -->
  <div class="focus-reticle" id="focus-reticle"></div>

  <!-- UI FLOTANTE -->
  <div class="ar-ui-container">
    <div class="top-bar">
      <div class="badge">
        <span class="pulse-dot" id="lock-dot"></span>
        <span id="badge-text">VLAB_N • TURBO-LOCK V16</span>
      </div>
      <div style="display:flex; gap:0.35rem;">
        <button class="btn-marker-help" id="btn-orient-toggle" style="cursor:pointer; background:rgba(0,242,254,0.25);">🖥️ Mesa</button>
        <button class="btn-marker-help" id="btn-focus-top" style="cursor:pointer; background:rgba(0,242,254,0.2);">🎯 Enfocar</button>
        <a href="marcador.html?v=rev16" target="_blank" class="btn-marker-help">📄 Diana</a>
      </div>
    </div>

    <div class="status-toast" id="tracking-status">
      🔍 Apunta la cámara al cuadro negro de la Diana
    </div>

    <div class="bottom-hud">
      <div class="hud-line"><span>Detector Cuadro:</span> <span id="ar-track">Escaneando...</span></div>
      <div class="hud-line"><span> Filtro Óptico:</span> <span id="ar-threshold" style="color:#10b981;">Auto-Umbral + Giroscopio</span></div>
      <div class="hud-line"><span>Proyección:</span> <span id="ar-orient-val">Mesa (Horizontal)</span></div>
      <div class="hud-line"><span>Longitud (L):</span> <span id="ar-l">0.70 m</span></div>
      <div class="hud-line"><span>Ángulo (&theta;):</span> <span id="ar-angle">25.0°</span></div>
    </div>
  </div>

  <!-- ESCENA AR CON PROPORCIÓN 4:3 EXACTA (640x480 SIN DEFORMACIÓN RECTANGULAR) -->
  <a-scene embedded 
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
           arjs="sourceType: webcam; sourceWidth: 640; sourceHeight: 480; canvasWidth: 640; canvasHeight: 480; displayWidth: 640; displayHeight: 480; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best; maxDetectionRate: 60; patternRatio: 0.5;">
    
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.25;"></a-entity>
    <a-entity light="type: directional; color: #00f2fe; intensity: 1.5; position: 1 3 2;"></a-entity>

    <!-- 1. DIANA OFICIAL NATEX (16x16 Bloques Puros) -->
    <a-marker type="pattern" preset="custom" url="./pattern-natex.patt?v=rev16" patternRatio="0.5" 
              minConfidence="0.08" emitsEvents="true" id="natex-target">
    </a-marker>

    <!-- 2. FALLBACK UNIVERSAL HIRO -->
    <a-marker preset="hiro" minConfidence="0.08" emitsEvents="true" id="hiro-target">
    </a-marker>

    <!-- 3. FALLBACK MATRIZ BINARIA 3x3 (Código #5 de respuesta ultra-rápida) -->
    <a-marker type="barcode" value="5" emitsEvents="true" id="barcode-target">
    </a-marker>

    <!-- ANCLAJE UNIVERSAL ULTRA-ESTABLE (SOPORTA PATRÓN + CUADRO NEGRO DIRECTO) -->
    <a-entity id="stabilized-anchor" visible="false">
      <!-- Anillo Holográfico de Confirmación en la Base -->
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="0.38" radius-outer="0.44" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.85; side: double;"></a-ring>

      <a-entity id="apparatus-container" position="0 0 0" rotation="0 0 0" scale="0.48 0.48 0.48">
        <!-- Base de Soporte -->
        <a-box id="base-plate" position="0 0.03 0" width="0.7" height="0.06" depth="0.4" color="#0f141c" material="metalness: 0.8; roughness: 0.2;"></a-box>
        <a-box position="0 0.03 0" width="0.72" height="0.015" depth="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.6;"></a-box>

        <!-- Mástil Vertical al Fondo (Z = -0.20) -->
        <a-cylinder id="stand-mast" position="0 0.5 -0.2" radius="0.025" height="1.0" color="#94a3b8" material="metalness: 0.9; roughness: 0.1;"></a-cylinder>

        <!-- Mordaza y Brazo Horizontal hacia el frente -->
        <a-box id="stand-clamp" position="0 1.0 -0.2" width="0.08" height="0.08" depth="0.08" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.5;"></a-box>
        <a-cylinder id="stand-arm" position="0 1.0 -0.1" rotation="90 0 0" radius="0.018" height="0.22" color="#94a3b8"></a-cylinder>

        <!-- PIVOTE Y PÉNDULO (Oscilación lateral izquierda-derecha) -->
        <a-entity id="pendulum-pivot" position="0 1.0 0">
          <a-cylinder id="pendulum-rod" position="0 -0.35 0" radius="0.012" height="0.7" color="#ffffff"></a-cylinder>
          <a-sphere id="pendulum-bob" position="0 -0.7 0" radius="0.15" color="#00f2fe" material="metalness: 0.3; roughness: 0.1; emissive: #00f2fe; emissiveIntensity: 0.85;"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ELEMENTOS DEL DOM Y ESCENA 3D
    const sceneEl = document.querySelector('a-scene');
    const quadCanvas = document.getElementById('quad-overlay');
    const quadCtx = quadCanvas.getContext('2d');
    const stabilizedAnchor = document.getElementById('stabilized-anchor');
    const apparatusContainer = document.getElementById('apparatus-container');
    const standMast = document.getElementById('stand-mast');
    const standClamp = document.getElementById('stand-clamp');
    const standArm = document.getElementById('stand-arm');
    const pendulumPivot = document.getElementById('pendulum-pivot');
    const pendulumRod = document.getElementById('pendulum-rod');
    const pendulumBob = document.getElementById('pendulum-bob');

    const natexMarker = document.getElementById('natex-target');
    const hiroMarker = document.getElementById('hiro-target');
    const barcodeMarker = document.getElementById('barcode-target');
    const trackStatus = document.getElementById('tracking-status');
    const arTrackText = document.getElementById('ar-track');
    const arThresholdText = document.getElementById('ar-threshold');
    const lockDot = document.getElementById('lock-dot');

    // Ajustar tamaño del canvas overlay 2D
    function resizeOverlay() {
      quadCanvas.width = window.innerWidth;
      quadCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeOverlay);
    resizeOverlay();

    // Desaparición Automática del Texto de Alerta tras 2.2 Segundos
    let toastTimer = null;
    let currentlyLockedState = false;

    function onMarkerDetected(name) {
      if (!currentlyLockedState) {
        currentlyLockedState = true;
        lockDot.classList.add('locked');
        clearTimeout(toastTimer);
        trackStatus.style.display = "block";
        trackStatus.style.opacity = "1";
        trackStatus.innerText = "🎯 ¡" + name + " Anclado Instantáneamente!";
        trackStatus.style.borderColor = "#10b981";
        trackStatus.style.color = "#10b981";

        toastTimer = setTimeout(() => {
          trackStatus.style.opacity = "0";
          setTimeout(() => { trackStatus.style.display = "none"; }, 400);
        }, 2000);
      }
      arTrackText.innerText = "ANCLADO (" + name + ")";
      arTrackText.style.color = "#10b981";
    }

    function onMarkerLost() {
      currentlyLockedState = false;
      lockDot.classList.remove('locked');
      clearTimeout(toastTimer);
      trackStatus.style.display = "block";
      trackStatus.style.opacity = "1";
      trackStatus.innerText = "🔍 Apunta la cámara al cuadro negro de la Diana";
      trackStatus.style.borderColor = "#00f2fe";
      trackStatus.style.color = "#00f2fe";
      arTrackText.innerText = "Escaneando Cuadro...";
      arTrackText.style.color = "#00f2fe";
    }

    // FÍSICA AUTÓNOMA DETERMINISTA Y SINCRONIZACIÓN POR EVENTOS
    let state = { theta: Math.PI / 5, omega: 0.0 };
    let params = { length: 0.7, gravity: 9.8, friction: 0.03, paused: false };

    function flashStatus(text) {
      clearTimeout(toastTimer);
      trackStatus.style.display = "block";
      trackStatus.style.opacity = "1";
      trackStatus.innerText = text;
      trackStatus.style.borderColor = "#00f2fe";
      trackStatus.style.color = "#00f2fe";
      toastTimer = setTimeout(() => {
        trackStatus.style.opacity = "0";
        setTimeout(() => { trackStatus.style.display = "none"; }, 400);
      }, 2000);
    }

    // IMPORTANTE: Solo aplicar enfoque y exposición continua SIN cambiar jamás width/height
    // para preservar la geometría cuadrada 4:3 exacta de ARToolKit (640x480)
    let currentVideoTrack = null;
    function setupCameraFocusOnly() {
      let attempts = 0;
      const checkVideo = setInterval(() => {
        attempts++;
        const video = document.getElementById('arjs-video') || document.querySelector('video');
        if (video && video.srcObject) {
          const tracks = video.srcObject.getVideoTracks();
          if (tracks.length > 0) {
            currentVideoTrack = tracks[0];
            clearInterval(checkVideo);
            applyFocusConstraintsOnly();
          }
        }
        if (attempts > 30) clearInterval(checkVideo);
      }, 400);
    }

    function applyFocusConstraintsOnly() {
      if (!currentVideoTrack || !currentVideoTrack.applyConstraints) return;
      try {
        const caps = currentVideoTrack.getCapabilities ? currentVideoTrack.getCapabilities() : {};
        const adv = {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
        if (caps.exposureMode && caps.exposureMode.includes('continuous')) adv.exposureMode = 'continuous';
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) adv.whiteBalanceMode = 'continuous';

        if (Object.keys(adv).length > 0) {
          currentVideoTrack.applyConstraints({ advanced: [adv] }).catch(() => {});
        }
      } catch (e) {}
    }

    function triggerCameraRefocus() {
      const reticle = document.getElementById('focus-reticle');
      if (reticle) {
        reticle.classList.add('active');
        setTimeout(() => reticle.classList.remove('active'), 750);
      }
      if (navigator.vibrate) navigator.vibrate(35);

      if (currentVideoTrack && currentVideoTrack.applyConstraints) {
        try {
          const caps = currentVideoTrack.getCapabilities ? currentVideoTrack.getCapabilities() : {};
          if (caps.focusMode) {
            if (caps.focusMode.includes('single-shot')) {
              currentVideoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] })
                .then(() => {
                  setTimeout(() => {
                    if (caps.focusMode.includes('continuous')) {
                      currentVideoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                    }
                  }, 550);
                }).catch(() => {});
            } else if (caps.focusMode.includes('continuous')) {
              currentVideoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            }
          }
        } catch (e) {}
      }
      flashStatus("🎯 Enfocando lente sobre el cuadro...");
    }

    document.getElementById('btn-focus-top').onclick = (e) => {
      e.stopPropagation();
      triggerCameraRefocus();
    };

    window.addEventListener('load', setupCameraFocusOnly);

    // GIROSCOPIO COMPLEMENTARIO (Mantiene estabilidad rotacional durante micro-oclusiones)
    let gyroActive = false;
    let lastGyroAlpha = null, lastGyroBeta = null, lastGyroGamma = null;
    const gyroDeltaEuler = new THREE.Euler(0, 0, 0, 'YXZ');
    const gyroDeltaQuat = new THREE.Quaternion();

    function handleOrientation(event) {
      if (event.alpha === null || event.beta === null || event.gamma === null) return;
      const deg2rad = Math.PI / 180;
      if (lastGyroAlpha !== null) {
        const dAlpha = (event.alpha - lastGyroAlpha) * deg2rad;
        const dBeta = (event.beta - lastGyroBeta) * deg2rad;
        const dGamma = (event.gamma - lastGyroGamma) * deg2rad;
        if (Math.abs(dAlpha) < 0.3 && Math.abs(dBeta) < 0.3 && Math.abs(dGamma) < 0.3) {
          gyroDeltaEuler.set(dBeta * 0.35, dAlpha * 0.35, -dGamma * 0.35);
          gyroDeltaQuat.setFromEuler(gyroDeltaEuler);
        } else {
          gyroDeltaQuat.identity();
        }
      }
      lastGyroAlpha = event.alpha;
      lastGyroBeta = event.beta;
      lastGyroGamma = event.gamma;
    }

    function initGyro() {
      if (gyroActive) return;
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(r => {
            if (r === 'granted') {
              gyroActive = true;
              window.addEventListener('deviceorientation', handleOrientation);
            }
          }).catch(() => {});
        } else {
          gyroActive = true;
          window.addEventListener('deviceorientation', handleOrientation);
        }
      }
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('button') && !e.target.closest('a')) {
        initGyro();
        triggerCameraRefocus();
      }
    });

    // Orientación de Proyección (Mesa horizontal vs Pared/Monitor vertical)
    let currentOrientation = 'desk';
    function applyOrientation(mode) {
      currentOrientation = mode;
      const rot = (mode === 'wall') ? "-90 0 0" : "0 0 0";
      if (apparatusContainer) apparatusContainer.setAttribute('rotation', rot);

      const btn = document.getElementById('btn-orient-toggle');
      if (btn) btn.innerText = (mode === 'wall') ? "🧱 Pared" : "🖥️ Mesa";
      const lbl = document.getElementById('ar-orient-val');
      if (lbl) lbl.innerText = (mode === 'wall') ? "Pared / Monitor" : "Mesa (Horizontal)";
    }

    document.getElementById('btn-orient-toggle').onclick = (e) => {
      e.stopPropagation();
      applyOrientation(currentOrientation === 'desk' ? 'wall' : 'desk');
      flashStatus("Proyección: " + (currentOrientation === 'wall' ? "Pared / Monitor" : "Mesa"));
    };

    // Sincronización MQTT por Eventos con el Profesor
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });
    client.on('connect', () => {
      client.subscribe("vlab-n/sala-natex");
    });

    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());
        if (payload.type === 'PARAM_CHANGE' || payload.type === 'SYNC') {
          if (payload.length !== undefined) params.length = payload.length;
          if (payload.gravity !== undefined) params.gravity = payload.gravity;
          if (payload.friction !== undefined) params.friction = payload.friction;
          if (payload.paused !== undefined) params.paused = payload.paused;

          if (payload.orientation && payload.orientation !== currentOrientation) {
            applyOrientation(payload.orientation);
          }

          if (payload.action === 'RESET' || payload.action === 'PUSH' || payload.action === 'STEP' || payload.action === 'SYNC_ALL' || payload.action === 'INIT') {
            if (payload.theta !== undefined) state.theta = payload.theta;
            if (payload.omega !== undefined) state.omega = payload.omega;
          }

          let deg = state.theta * 180 / Math.PI;
          updateVisuals(deg, params.length);

          if (payload.action === 'PUSH') {
            flashStatus("⚡ ¡Empujón del Docente!");
          } else if (payload.action !== 'INIT') {
            flashStatus("⚡ Docente actualizó parámetros físicos");
          }
        }
      } catch (e) {}
    });

    function updateVisuals(deg, len) {
      const H = len + 0.35;
      standMast.setAttribute('height', H);
      standMast.setAttribute('position', `0 ${H / 2} -0.2`);
      standClamp.setAttribute('position', `0 ${H} -0.2`);
      standArm.setAttribute('position', `0 ${H} -0.1`);
      pendulumPivot.setAttribute('position', `0 ${H} 0`);
      pendulumPivot.setAttribute('rotation', `0 0 ${deg}`);
      pendulumRod.setAttribute('height', len);
      pendulumRod.setAttribute('position', `0 ${-len / 2} 0`);
      pendulumBob.setAttribute('position', `0 ${-len} 0`);

      document.getElementById('ar-l').innerText = len.toFixed(2) + ' m';
      document.getElementById('ar-angle').innerText = deg.toFixed(1) + '°';
    }

    // ============================================================================
    // MOTOR DE DETECCIÓN ÓPTICA TURBO-LOCK V16:
    // 1. Decomposición real de Matrix4 (corrige matrixAutoUpdate=false de AR.js)
    // 2. Barrido Automático Multi-Umbral (70..185) para pantallas brillantes y papel
    // 3. Anclaje Universal Directo al Cuadrado Negro (getTransMatSquare) si el
    //    patrón interno sufre reflejo/Moiré, garantizando detección en <50ms!
    // ============================================================================
    let activeMarkerObj = null;
    let activeMarkerName = "Diana";
    let lastSeenTime = 0;
    const GRACE_PERIOD_MS = 850; // 850ms de persistencia con soporte de giroscopio

    const currentPos = new THREE.Vector3();
    const targetPos = new THREE.Vector3();
    const currentQuat = new THREE.Quaternion();
    const targetQuat = new THREE.Quaternion();
    const tempScale = new THREE.Vector3();
    const rawMatrix = new THREE.Matrix4();
    const axisFixMatrix = new THREE.Matrix4().makeRotationX(Math.PI / 2);
    let isPoseInitialized = false;

    // Barrido de umbrales de iluminación (cubre monitores brillantes, celulares y papel en sombra)
    const THRESHOLD_SWEEP = [100, 135, 80, 160, 118, 65, 148, 175, 92, 125];
    let sweepIdx = 0;
    let frameCount = 0;

    natexMarker.addEventListener('markerFound', () => {
      activeMarkerObj = natexMarker.object3D;
      activeMarkerName = "Diana Natex";
    });
    hiroMarker.addEventListener('markerFound', () => {
      activeMarkerObj = hiroMarker.object3D;
      activeMarkerName = "Diana Hiro";
    });
    barcodeMarker.addEventListener('markerFound', () => {
      activeMarkerObj = barcodeMarker.object3D;
      activeMarkerName = "Matriz 3x3";
    });

    // Obtener arController interno de AR.js y función de conversión de matriz
    function getArController() {
      try {
        const sys = sceneEl && sceneEl.systems && sceneEl.systems['arjs'];
        if (sys && sys._arSession && sys._arSession.arContext && sys._arSession.arContext.arController) {
          return sys._arSession.arContext.arController;
        }
      } catch (e) {}
      return null;
    }

    // Dibujar polígono láser sobre el cuadro detectado en la pantalla
    function drawDetectedQuad(vertex, canvasW, canvasH, isLocked) {
      quadCtx.clearRect(0, 0, quadCanvas.width, quadCanvas.height);
      if (!vertex || vertex.length < 4) return;

      // Mapear coordenadas 640x480 al viewport cubierto (object-fit: cover)
      const vw = quadCanvas.width;
      const vh = quadCanvas.height;
      const scale = Math.max(vw / canvasW, vh / canvasH);
      const offsetX = (vw - canvasW * scale) / 2;
      const offsetY = (vh - canvasH * scale) / 2;

      quadCtx.save();
      quadCtx.beginPath();
      for (let i = 0; i < 4; i++) {
        const px = vertex[i][0] * scale + offsetX;
        const py = vertex[i][1] * scale + offsetY;
        if (i === 0) quadCtx.moveTo(px, py);
        else quadCtx.lineTo(px, py);
      }
      quadCtx.closePath();
      quadCtx.lineWidth = 3;
      quadCtx.strokeStyle = isLocked ? '#10b981' : '#00f2fe';
      quadCtx.shadowColor = isLocked ? '#10b981' : '#00f2fe';
      quadCtx.shadowBlur = 12;
      quadCtx.stroke();

      // Esquinas reforzadas
      for (let i = 0; i < 4; i++) {
        const px = vertex[i][0] * scale + offsetX;
        const py = vertex[i][1] * scale + offsetY;
        quadCtx.fillStyle = '#00f2fe';
        quadCtx.beginPath();
        quadCtx.arc(px, py, 5, 0, Math.PI * 2);
        quadCtx.fill();
      }
      quadCtx.restore();
    }

    // Bucle de Renderizado, Detección Turbo-Quad y Física RK4 (60 FPS)
    let lastT = performance.now();
    function tick() {
      requestAnimationFrame(tick);
      frameCount++;
      let now = performance.now();
      let dt = (now - lastT) / 1000;
      lastT = now;
      if (dt > 0.1) dt = 0.1;

      const arController = getArController();
      let poseFoundThisFrame = false;

      // 1. Verificar si alguno de los <a-marker> estándar está visible
      if (natexMarker.object3D && natexMarker.object3D.visible) {
        activeMarkerObj = natexMarker.object3D;
        activeMarkerName = "Diana Natex";
        // CRÍTICO: AR.js escribe directamente en .matrix con matrixAutoUpdate=false
        activeMarkerObj.matrix.decompose(targetPos, targetQuat, tempScale);
        poseFoundThisFrame = true;
      } else if (hiroMarker.object3D && hiroMarker.object3D.visible) {
        activeMarkerObj = hiroMarker.object3D;
        activeMarkerName = "Diana Hiro";
        activeMarkerObj.matrix.decompose(targetPos, targetQuat, tempScale);
        poseFoundThisFrame = true;
      } else if (barcodeMarker.object3D && barcodeMarker.object3D.visible) {
        activeMarkerObj = barcodeMarker.object3D;
        activeMarkerName = "Matriz 3x3";
        activeMarkerObj.matrix.decompose(targetPos, targetQuat, tempScale);
        poseFoundThisFrame = true;
      }

      // 2. DETECTOR UNIVERSAL DE CUADRADO NEGRO EN DIRECTO (Fallback Instantáneo)
      // Si ARToolKit ve un cuadrado negro válido en cámara (getMarkerNum() > 0),
      // dibujamos su silueta láser y, si el patrón interno dudó por brillo de pantalla,
      // calculamos su matriz 3D directamente desde el cuadrado exterior!
      let bestSquareVertex = null;
      if (arController) {
        const numMarkers = arController.getMarkerNum();
        if (numMarkers > 0) {
          let bestArea = 0;
          let bestIdx = -1;
          for (let i = 0; i < numMarkers; i++) {
            const m = arController.getMarker(i);
            // Filtrar cuadrados con área razonable (> 600 px² en 640x480)
            if (m && m.area > 600 && m.area > bestArea) {
              bestArea = m.area;
              bestIdx = i;
              bestSquareVertex = m.vertex;
            }
          }

          if (bestIdx !== -1 && !poseFoundThisFrame) {
            try {
              const transMat = arController.transMat;
              arController.getTransMatSquare(bestIdx, 1.0, transMat);
              const glMat = arController.transMatToGLMat(transMat);
              rawMatrix.fromArray(glMat);
              // Ajustar eje Z->Y igual que THREEx.ArMarkerControls (changeMatrixMode: modelViewMatrix)
              rawMatrix.multiply(axisFixMatrix);
              rawMatrix.decompose(targetPos, targetQuat, tempScale);
              // Validar que la posición Z sea coherente (frente a la cámara)
              if (targetPos.lengthSq() > 0.01 && targetPos.lengthSq() < 100) {
                poseFoundThisFrame = true;
                activeMarkerName = "Cuadro Óptico";
              }
            } catch (e) {}
          }
        }

        // 3. BARRIDO MULTI-UMBRAL AUTOMÁTICO CUANDO NO HAY DETECCIÓN
        if (!poseFoundThisFrame && frameCount % 2 === 0) {
          sweepIdx = (sweepIdx + 1) % THRESHOLD_SWEEP.length;
          const nextTh = THRESHOLD_SWEEP[sweepIdx];
          if (typeof arController.setThreshold === 'function') {
            arController.setThreshold(nextTh);
            arThresholdText.innerText = "Barrido Auto (Lum: " + nextTh + ")";
          }
        } else if (poseFoundThisFrame && typeof arController.getThreshold === 'function') {
          arThresholdText.innerText = "Bloqueado (Lum: " + arController.getThreshold() + ")";
        }
      }

      // Dibujar confirmación láser 2D en pantalla si hay un cuadrado a la vista
      if (bestSquareVertex) {
        drawDetectedQuad(bestSquareVertex, 640, 480, poseFoundThisFrame);
      } else {
        quadCtx.clearRect(0, 0, quadCanvas.width, quadCanvas.height);
      }

      // 4. APLICAR POSE 3D CON SUAVIZADO LERP/SLERP Y PERSISTENCIA
      if (poseFoundThisFrame) {
        lastSeenTime = now;
        onMarkerDetected(activeMarkerName);

        if (!isPoseInitialized) {
          currentPos.copy(targetPos);
          currentQuat.copy(targetQuat);
          isPoseInitialized = true;
        } else {
          // Respuesta rápida (0.35) para seguimiento inmediato sin temblor
          currentPos.lerp(targetPos, 0.35);
          currentQuat.slerp(targetQuat, 0.35);
        }

        stabilizedAnchor.object3D.position.copy(currentPos);
        stabilizedAnchor.object3D.quaternion.copy(currentQuat);
        stabilizedAnchor.setAttribute('visible', true);
      } else {
        // Sostener pose durante micro-cortes de luz apoyado por el giroscopio
        if (now - lastSeenTime < GRACE_PERIOD_MS && isPoseInitialized) {
          if (gyroActive) {
            currentQuat.multiply(gyroDeltaQuat);
            gyroDeltaQuat.identity();
            stabilizedAnchor.object3D.quaternion.copy(currentQuat);
          }
          stabilizedAnchor.setAttribute('visible', true);
        } else {
          if (stabilizedAnchor.getAttribute('visible') !== false && stabilizedAnchor.getAttribute('visible') !== 'false') {
            stabilizedAnchor.setAttribute('visible', false);
            isPoseInitialized = false;
            onMarkerLost();
          }
        }
      }

      // 5. FÍSICA RK4 DETERMINISTA
      if (!params.paused) {
        let gL = params.gravity / Math.max(0.2, params.length);
        let k1_th = state.omega;
        let k1_om = -gL * Math.sin(state.theta) - params.friction * state.omega;
        let k2_th = state.omega + 0.5 * dt * k1_om;
        let k2_om = -gL * Math.sin(state.theta + 0.5 * dt * k1_th) - params.friction * (state.omega + 0.5 * dt * k1_om);
        state.theta += dt * k2_th;
        state.omega += dt * k2_om;

        let deg = state.theta * 180 / Math.PI;
        updateVisuals(deg, params.length);
      }
    }

    // Inicialización al cargar
    updateVisuals(state.theta * 180 / Math.PI, params.length);
    applyOrientation('desk');
    requestAnimationFrame(tick);
  </script>
</body>
</html>
