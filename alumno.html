<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cámara AR | VirtualLab_N</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; background: #000; }
    
    .ar-ui-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 99999;
      display: flex; flex-direction: column; justify-content: space-between; padding: 0.8rem;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
    }
    .badge {
      background: rgba(15, 20, 28, 0.9); border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      padding: 0.4rem 0.8rem; border-radius: 20px; backdrop-filter: blur(8px);
    }
    .btn-marker-help {
      background: rgba(0, 242, 254, 0.15); border: 1px solid #00f2fe; color: #00f2fe;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
      padding: 0.4rem 0.8rem; border-radius: 20px; text-decoration: none; pointer-events: auto;
    }
    
    .status-toast {
      align-self: center; background: rgba(7, 9, 14, 0.9); border: 1px solid #00f2fe;
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      padding: 0.4rem 1rem; border-radius: 20px; box-shadow: 0 0 15px rgba(0,242,254,0.3);
      text-align: center;
    }

    .bottom-hud {
      background: rgba(15, 20, 28, 0.9); border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 12px; padding: 0.75rem 1rem; backdrop-filter: blur(10px);
      display: flex; flex-direction: column; gap: 0.25rem; pointer-events: auto;
    }
    .hud-line {
      display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #fff;
    }
    .hud-line span:last-child { color: #00f2fe; font-weight: 700; }
  </style>

  <!-- Auto Cache-Buster Revision 7 -->
  <script>
    const CURRENT_REV = "rev7_natex_emits_events";
    if (new URLSearchParams(window.location.search).get("v") !== CURRENT_REV) {
      window.location.replace("alumno.html?v=" + CURRENT_REV);
    }
  </script>
</head>
<body>

  <!-- UI FLOTANTE -->
  <div class="ar-ui-container">
    <div class="top-bar">
      <div class="badge">VLAB_N • CALIBRADO NATEX V7</div>
      <a href="marcador.html" target="_blank" class="btn-marker-help">📄 Ver Diana Natex</a>
    </div>

    <div class="status-toast" id="tracking-status">
      🔍 Apunta la cámara a la Diana Natex (o a Hiro como respaldo)
    </div>

    <div class="bottom-hud">
      <div class="hud-line"><span>Anclaje Mesa:</span> <span id="ar-track">Buscando Diana...</span></div>
      <div class="hud-line"><span>Sincronización Docente:</span> <span id="sync-rate" style="color:#10b981;">30 FPS En Vivo</span></div>
      <div class="hud-line"><span>Longitud (L):</span> <span id="ar-l">1.00 m</span></div>
      <div class="hud-line"><span>Ángulo (&theta;):</span> <span id="ar-angle">0.0°</span></div>
    </div>
  </div>

  <!-- ESCENA AR CON DOBLE COMPATIBILIDAD (NATEX RATIO 0.5 + HIRO) -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
    
    <!-- 1. DIANA OFICIAL NATEX (Círculo, Triángulo, Diamante, Cuadrado y N) -->
    <a-marker type="pattern" url="./pattern-natex.patt" patternRatio="0.5" emitsEvents="true" smooth="true" smoothCount="5" id="natex-target">
      <!-- Base de Metal -->
      <a-box position="0.1 0.02 0" width="0.65" height="0.04" depth="0.4" color="#1e293b" metalness="0.8" roughness="0.2"></a-box>
      <!-- Mástil Vertical -->
      <a-cylinder position="0.32 0.75 0" radius="0.02" height="1.5" color="#94a3b8" metalness="0.9" roughness="0.1"></a-cylinder>
      <!-- Mordaza -->
      <a-box position="0.32 1.48 0" width="0.07" height="0.07" depth="0.07" color="#00f2fe"></a-box>
      <!-- Brazo Horizontal -->
      <a-cylinder position="0.15 1.48 0" rotation="0 0 90" radius="0.015" height="0.38" color="#94a3b8"></a-cylinder>

      <!-- Péndulo Sincronizado en Vivo -->
      <a-entity id="pendulum-pivot-natex" position="0 1.48 0">
        <a-cylinder id="pendulum-rod-natex" position="0 -0.4 0" radius="0.008" height="0.8" color="#ffffff"></a-cylinder>
        <a-sphere id="pendulum-bob-natex" position="0 -0.8 0" radius="0.11" color="#00f2fe" material="metalness: 0.5; roughness: 0.1; emissive: #00f2fe; emissiveIntensity: 0.4;"></a-sphere>
      </a-entity>
    </a-marker>

    <!-- 2. FALLBACK UNIVERSAL HIRO -->
    <a-marker preset="hiro" emitsEvents="true" smooth="true" smoothCount="5" id="hiro-target">
      <a-box position="0.1 0.02 0" width="0.65" height="0.04" depth="0.4" color="#1e293b" metalness="0.8" roughness="0.2"></a-box>
      <a-cylinder position="0.32 0.75 0" radius="0.02" height="1.5" color="#94a3b8" metalness="0.9" roughness="0.1"></a-cylinder>
      <a-box position="0.32 1.48 0" width="0.07" height="0.07" depth="0.07" color="#00f2fe"></a-box>
      <a-cylinder position="0.15 1.48 0" rotation="0 0 90" radius="0.015" height="0.38" color="#94a3b8"></a-cylinder>
      <a-entity id="pendulum-pivot-hiro" position="0 1.48 0">
        <a-cylinder id="pendulum-rod-hiro" position="0 -0.4 0" radius="0.008" height="0.8" color="#ffffff"></a-cylinder>
        <a-sphere id="pendulum-bob-hiro" position="0 -0.8 0" radius="0.11" color="#00f2fe" material="metalness: 0.5; roughness: 0.1; emissive: #00f2fe; emissiveIntensity: 0.4;"></a-sphere>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const pivotNatex = document.getElementById('pendulum-pivot-natex');
    const rodNatex = document.getElementById('pendulum-rod-natex');
    const bobNatex = document.getElementById('pendulum-bob-natex');

    const pivotHiro = document.getElementById('pendulum-pivot-hiro');
    const rodHiro = document.getElementById('pendulum-rod-hiro');
    const bobHiro = document.getElementById('pendulum-bob-hiro');

    const natexMarker = document.getElementById('natex-target');
    const hiroMarker = document.getElementById('hiro-target');
    const trackStatus = document.getElementById('tracking-status');
    const arTrackText = document.getElementById('ar-track');

    function onMarkerDetected(name) {
      trackStatus.innerText = "🎯 ¡" + name + " Detectado! Anclado en 3D";
      trackStatus.style.borderColor = "#10b981";
      trackStatus.style.color = "#10b981";
      arTrackText.innerText = "ANCLADO EN 3D";
      arTrackText.style.color = "#10b981";
    }

    function onMarkerLost() {
      trackStatus.innerText = "🔍 Apunta la cámara a la Diana Natex";
      trackStatus.style.borderColor = "#00f2fe";
      trackStatus.style.color = "#00f2fe";
      arTrackText.innerText = "Buscando Diana...";
      arTrackText.style.color = "#00f2fe";
    }

    natexMarker.addEventListener('markerFound', () => onMarkerDetected("Diana Natex"));
    natexMarker.addEventListener('markerLost', onMarkerLost);
    hiroMarker.addEventListener('markerFound', () => onMarkerDetected("Marcador Hiro"));
    hiroMarker.addEventListener('markerLost', onMarkerLost);

    // SINCRONIZACIÓN 100% EN TIEMPO REAL CON EL PROFESOR
    let currentLength = 0.8;
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });
    
    client.on('connect', () => {
      client.subscribe("vlab-n/sala-natex");
    });

    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());
        if (payload.type === 'SYNC') {
          // El ángulo del alumno es un espejo idéntico del ángulo del profesor
          let deg = payload.theta * 180 / Math.PI;
          pivotNatex.setAttribute('rotation', `0 0 ${deg}`);
          pivotHiro.setAttribute('rotation', `0 0 ${deg}`);

          // Si el profesor cambió la longitud, actualiza la cuerda y la esfera
          if (payload.length !== currentLength) {
            currentLength = payload.length;
            rodNatex.setAttribute('height', currentLength);
            rodNatex.setAttribute('position', `0 ${-currentLength / 2} 0`);
            bobNatex.setAttribute('position', `0 ${-currentLength} 0`);

            rodHiro.setAttribute('height', currentLength);
            rodHiro.setAttribute('position', `0 ${-currentLength / 2} 0`);
            bobHiro.setAttribute('position', `0 ${-currentLength} 0`);

            document.getElementById('ar-l').innerText = currentLength.toFixed(2) + ' m';
          }

          document.getElementById('ar-angle').innerText = deg.toFixed(1) + '°';
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
