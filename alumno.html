<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cámara AR | VirtualLab_N</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; background: #000; }
    
    .ar-ui-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 99999;
      display: flex; flex-direction: column; justify-content: space-between; padding: 0.8rem;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
    }
    .badge {
      background: rgba(15, 20, 28, 0.9); border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      padding: 0.4rem 0.8rem; border-radius: 20px; backdrop-filter: blur(8px);
    }
    .btn-marker-help {
      background: rgba(0, 242, 254, 0.15); border: 1px solid #00f2fe; color: #00f2fe;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
      padding: 0.4rem 0.8rem; border-radius: 20px; text-decoration: none; pointer-events: auto;
    }
    
    /* Toast con desaparición suave automática */
    .status-toast {
      align-self: center; background: rgba(7, 9, 14, 0.92); border: 1px solid #00f2fe;
      color: #00f2fe; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      padding: 0.45rem 1.1rem; border-radius: 20px; box-shadow: 0 0 15px rgba(0,242,254,0.3);
      text-align: center; transition: opacity 0.5s ease; pointer-events: none;
    }

    .bottom-hud {
      background: rgba(15, 20, 28, 0.92); border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 14px; padding: 0.75rem 1rem; backdrop-filter: blur(10px);
      display: flex; flex-direction: column; gap: 0.35rem; pointer-events: auto;
    }
    .hud-line {
      display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #fff;
    }
    .hud-line span:last-child { color: #00f2fe; font-weight: 700; }

    /* Botón de Empujón Físico */
    .btn-push {
      width: 100%; background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none; color: #000; font-family: 'JetBrains Mono', monospace; font-weight: 800;
      padding: 0.7rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer; margin-top: 0.3rem;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 0 15px rgba(0,242,254,0.3);
    }
    .btn-push:active { transform: scale(0.98); filter: brightness(1.2); }
  </style>

  <!-- Auto Cache-Buster Revision 10 -->
  <script>
    const CURRENT_REV = "rev10_autohide_push";
    if (new URLSearchParams(window.location.search).get("v") !== CURRENT_REV) {
      window.location.replace("alumno.html?v=" + CURRENT_REV);
    }
  </script>
</head>
<body>

  <!-- UI FLOTANTE -->
  <div class="ar-ui-container">
    <div class="top-bar">
      <div class="badge">VLAB_N • INTERACTIVO V10</div>
      <a href="marcador.html" target="_blank" class="btn-marker-help">📄 Ver Diana</a>
    </div>

    <div class="status-toast" id="tracking-status">
      🔍 Apunta la cámara a la Diana Natex
    </div>

    <div class="bottom-hud">
      <div class="hud-line"><span>Anclaje:</span> <span id="ar-track">Buscando Diana...</span></div>
      <div class="hud-line"><span>Longitud (L):</span> <span id="ar-l">0.70 m</span></div>
      <div class="hud-line"><span>Ángulo (&theta;):</span> <span id="ar-angle">25.0°</span></div>
      
      <!-- Botón para revivir / darle un empujón -->
      <button class="btn-push" id="btn-push-action">
        ⚡ Dar Empujón al Péndulo
      </button>
    </div>
  </div>

  <!-- ESCENA AR -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
    
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2;"></a-entity>
    <a-entity light="type: directional; color: #00f2fe; intensity: 1.5; position: 1 3 2;"></a-entity>

    <!-- 1. DIANA OFICIAL NATEX -->
    <a-marker type="pattern" preset="custom" url="./pattern-natex.patt" patternRatio="0.5" emitsEvents="true" smooth="true" smoothCount="2" id="natex-target">
      
      <!-- Anillo Neón Cian en la Base -->
      <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="0.35" radius-outer="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.8;"></a-ring>
      
      <!-- APARATO COMPLETO DE LABORATORIO -->
      <a-entity position="0 0 0" scale="0.5 0.5 0.5">
        <a-box position="0.15 0.05 0" width="0.7" height="0.08" depth="0.4" color="#0f141c" material="metalness: 0.8; roughness: 0.2;"></a-box>
        <a-box position="0.15 0.05 0" width="0.72" height="0.02" depth="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.6;"></a-box>
        <a-cylinder position="0.38 0.65 0" radius="0.03" height="1.2" color="#94a3b8" material="metalness: 0.9; roughness: 0.1;"></a-cylinder>
        <a-box position="0.38 1.2 0" width="0.09" height="0.09" depth="0.09" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.5;"></a-box>
        <a-cylinder position="0.18 1.2 0" rotation="0 0 90" radius="0.02" height="0.45" color="#94a3b8"></a-cylinder>

        <a-entity id="pendulum-pivot-natex" position="0 1.2 0">
          <a-cylinder id="pendulum-rod-natex" position="0 -0.35 0" radius="0.012" height="0.7" color="#ffffff"></a-cylinder>
          <a-sphere id="pendulum-bob-natex" position="0 -0.7 0" radius="0.16" color="#00f2fe" material="metalness: 0.3; roughness: 0.1; emissive: #00f2fe; emissiveIntensity: 0.8;"></a-sphere>
        </a-entity>
      </a-entity>
    </a-marker>

    <!-- 2. FALLBACK UNIVERSAL HIRO -->
    <a-marker preset="hiro" emitsEvents="true" smooth="true" smoothCount="2" id="hiro-target">
      <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="0.35" radius-outer="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.8;"></a-ring>
      
      <a-entity position="0 0 0" scale="0.5 0.5 0.5">
        <a-box position="0.15 0.05 0" width="0.7" height="0.08" depth="0.4" color="#0f141c" material="metalness: 0.8; roughness: 0.2;"></a-box>
        <a-box position="0.15 0.05 0" width="0.72" height="0.02" depth="0.42" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.6;"></a-box>
        <a-cylinder position="0.38 0.65 0" radius="0.03" height="1.2" color="#94a3b8" material="metalness: 0.9; roughness: 0.1;"></a-cylinder>
        <a-box position="0.38 1.2 0" width="0.09" height="0.09" depth="0.09" color="#00f2fe" material="emissive: #00f2fe; emissiveIntensity: 0.5;"></a-box>
        <a-cylinder position="0.18 1.2 0" rotation="0 0 90" radius="0.02" height="0.45" color="#94a3b8"></a-cylinder>

        <a-entity id="pendulum-pivot-hiro" position="0 1.2 0">
          <a-cylinder id="pendulum-rod-hiro" position="0 -0.35 0" radius="0.012" height="0.7" color="#ffffff"></a-cylinder>
          <a-sphere id="pendulum-bob-hiro" position="0 -0.7 0" radius="0.16" color="#00f2fe" material="metalness: 0.3; roughness: 0.1; emissive: #00f2fe; emissiveIntensity: 0.8;"></a-sphere>
        </a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const pivotNatex = document.getElementById('pendulum-pivot-natex');
    const rodNatex = document.getElementById('pendulum-rod-natex');
    const bobNatex = document.getElementById('pendulum-bob-natex');

    const pivotHiro = document.getElementById('pendulum-pivot-hiro');
    const rodHiro = document.getElementById('pendulum-rod-hiro');
    const bobHiro = document.getElementById('pendulum-bob-hiro');

    const natexMarker = document.getElementById('natex-target');
    const hiroMarker = document.getElementById('hiro-target');
    const trackStatus = document.getElementById('tracking-status');
    const arTrackText = document.getElementById('ar-track');

    // Desaparición Automática del Texto de Alerta tras 2.5 Segundos
    let toastTimer = null;
    function onMarkerDetected(name) {
      clearTimeout(toastTimer);
      trackStatus.style.display = "block";
      trackStatus.style.opacity = "1";
      trackStatus.innerText = "🎯 ¡" + name + " Detectado! Anclado en 3D";
      trackStatus.style.borderColor = "#10b981";
      trackStatus.style.color = "#10b981";
      arTrackText.innerText = "ANCLADO EN 3D";
      arTrackText.style.color = "#10b981";

      toastTimer = setTimeout(() => {
        trackStatus.style.opacity = "0";
        setTimeout(() => { trackStatus.style.display = "none"; }, 500);
      }, 2500);
    }

    function onMarkerLost() {
      clearTimeout(toastTimer);
      trackStatus.style.display = "block";
      trackStatus.style.opacity = "1";
      trackStatus.innerText = "🔍 Apunta la cámara a la Diana Natex";
      trackStatus.style.borderColor = "#00f2fe";
      trackStatus.style.color = "#00f2fe";
      arTrackText.innerText = "Buscando Diana...";
      arTrackText.style.color = "#00f2fe";
    }

    natexMarker.addEventListener('markerFound', () => onMarkerDetected("Diana Natex"));
    natexMarker.addEventListener('markerLost', onMarkerLost);
    hiroMarker.addEventListener('markerFound', () => onMarkerDetected("Marcador Hiro"));
    hiroMarker.addEventListener('markerLost', onMarkerLost);

    // FÍSICA Y SINCRONIZACIÓN
    const myClientId = 'student_' + Math.random().toString(36).substring(2, 9);
    let state = { theta: Math.PI / 5, omega: 0.0 };
    let params = { length: 0.7, gravity: 9.8, friction: 0.03, paused: false };
    let hasRemoteSync = false;
    let lastRemoteSyncTime = 0;

    // Función para "Dar un Empujón" y revivir el péndulo
    function givePush() {
      if (Math.abs(state.theta) < 0.1 && Math.abs(state.omega) < 0.1) {
        state.theta = Math.PI / 4.5; // Relanzar a unos 40 grados
        state.omega = 1.2;
      } else {
        let dir = (state.omega >= 0) ? 1 : -1;
        state.omega += dir * 2.2; // Empujón en la dirección del movimiento
      }
      if (navigator.vibrate) navigator.vibrate(40);

      // Si estamos en red MQTT, avisar a la sala docente
      if (client && client.connected) {
        try {
          client.publish("vlab-n/sala-natex", JSON.stringify({ type: 'PUSH', sender: myClientId }));
        } catch (e) {}
      }
    }

    document.getElementById('btn-push-action').onclick = givePush;
    window.addEventListener('click', (e) => {
      // Si toca la pantalla fuera de botones, también da empujón
      if (!e.target.closest('button') && !e.target.closest('a')) {
        givePush();
      }
    });

    // MQTT Sincronización
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });
    client.on('connect', () => {
      client.subscribe("vlab-n/sala-natex");
    });

    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());
        if (payload.type === 'SYNC') {
          hasRemoteSync = true;
          lastRemoteSyncTime = performance.now();
          state.theta = payload.theta;
          state.omega = payload.omega;
          params.length = payload.length;
          params.gravity = payload.gravity;
          params.paused = payload.paused;

          let deg = payload.theta * 180 / Math.PI;
          updateVisuals(deg, params.length);
        } else if (payload.type === 'PUSH' && payload.sender !== myClientId) {
          if (!hasRemoteSync) {
            if (Math.abs(state.theta) < 0.1 && Math.abs(state.omega) < 0.1) {
              state.theta = Math.PI / 4.5;
              state.omega = 1.2;
            } else {
              let dir = (state.omega >= 0) ? 1 : -1;
              state.omega += dir * 2.2;
            }
          }
        }
      } catch (e) {}
    });

    function updateVisuals(deg, len) {
      pivotNatex.setAttribute('rotation', `0 0 ${deg}`);
      pivotHiro.setAttribute('rotation', `0 0 ${deg}`);

      rodNatex.setAttribute('height', len);
      rodNatex.setAttribute('position', `0 ${-len / 2} 0`);
      bobNatex.setAttribute('position', `0 ${-len} 0`);

      rodHiro.setAttribute('height', len);
      rodHiro.setAttribute('position', `0 ${-len / 2} 0`);
      bobHiro.setAttribute('position', `0 ${-len} 0`);

      document.getElementById('ar-l').innerText = len.toFixed(2) + ' m';
      document.getElementById('ar-angle').innerText = deg.toFixed(1) + '°';
    }

    // Bucle de Física RK4 Local Autónomo
    let lastT = performance.now();
    function tick() {
      requestAnimationFrame(tick);
      let now = performance.now();
      let dt = (now - lastT) / 1000;
      lastT = now;
      if (dt > 0.1) dt = 0.1;

      // Watchdog: si no hay paquetes del profesor por 1.5s, retomar física local autónoma
      if (hasRemoteSync && (now - lastRemoteSyncTime > 1500)) {
        hasRemoteSync = false;
      }

      if (!hasRemoteSync && !params.paused) {
        let gL = params.gravity / Math.max(0.2, params.length);
        let k1_th = state.omega;
        let k1_om = -gL * Math.sin(state.theta) - params.friction * state.omega;
        let k2_th = state.omega + 0.5 * dt * k1_om;
        let k2_om = -gL * Math.sin(state.theta + 0.5 * dt * k1_th) - params.friction * (state.omega + 0.5 * dt * k1_om);
        state.theta += dt * k2_th;
        state.omega += dt * k2_om;

        let deg = state.theta * 180 / Math.PI;
        updateVisuals(deg, params.length);
      }
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
