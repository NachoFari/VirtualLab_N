<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Visor 3D de Laboratorio | VirtualLab_N</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- Componentes y 5 Experimentos Interactivos -->
  <script src="assets/components/math_parser.js?v=rev18"></script>
  <script src="assets/components/surface_grid.js?v=rev18"></script>
  <script src="experiments/MEC-01.vlab.js?v=rev18"></script>
  <script src="experiments/MEC-02.vlab.js?v=rev18"></script>
  <script src="experiments/OPT-01.vlab.js?v=rev18"></script>
  <script src="experiments/QC-01.vlab.js?v=rev18"></script>
  <script src="experiments/MAT-01.vlab.js?v=rev18"></script>

  <style>
    :root {
      --bg-app: #090a0f;
      --bg-surface: #12151d;
      --bg-elevated: #1a1e29;
      --border-subtle: #262b3a;
      --border-focus: #475569;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --accent-success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-app); color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh; width: 100vw; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* TOP BAR SOBRIA */
    header {
      padding: 0.6rem 1.25rem; display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);
      z-index: 20; gap: 0.75rem; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--text-primary); }
    .logo-badge {
      width: 28px; height: 28px; background: var(--accent-primary); color: #fff;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem;
    }
    .brand-title { font-weight: 600; font-size: 0.92rem; letter-spacing: -0.01em; }
    .brand-sub { font-size: 0.72rem; color: var(--text-muted); margin-left: 0.4rem; }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .status-badge {
      font-size: 0.72rem; color: var(--accent-success); background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25); padding: 0.3rem 0.65rem; border-radius: 6px;
      font-weight: 500;
    }
    .nav-btn {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      color: var(--text-primary); font-size: 0.76rem; font-weight: 500;
      padding: 0.38rem 0.75rem; border-radius: 6px; text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover { background: #222736; border-color: var(--border-focus); }

    /* SELECTOR DE EXPERIMENTOS */
    .exp-bar {
      display: flex; gap: 0.4rem; overflow-x: auto; padding: 0.5rem 1.25rem;
      background: #0d1017; border-bottom: 1px solid var(--border-subtle);
      z-index: 20; scrollbar-width: none;
    }
    .exp-bar::-webkit-scrollbar { display: none; }
    .exp-pill {
      background: transparent; border: 1px solid transparent;
      color: var(--text-secondary); font-size: 0.78rem; font-weight: 500;
      padding: 0.42rem 0.85rem; border-radius: 6px; cursor: pointer;
      white-space: nowrap; transition: all 0.15s;
    }
    .exp-pill:hover { color: var(--text-primary); background: var(--bg-surface); }
    .exp-pill.active {
      background: var(--bg-elevated); color: var(--text-primary);
      border-color: var(--border-focus); font-weight: 600;
    }

    /* AREA DE TRABAJO */
    .workspace {
      flex: 1; display: grid; grid-template-columns: 1fr 350px; position: relative; overflow: hidden;
    }
    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    }

    .canvas-wrap {
      position: relative; width: 100%; height: 100%; background: #0a0d14; overflow: hidden;
    }
    #viewer-canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    #viewer-canvas:active { cursor: grabbing; }

    /* TARJETA DE DATOS EN VIVO */
    .hud-card {
      position: absolute; top: 1rem; left: 1rem; pointer-events: none;
      background: rgba(18, 21, 29, 0.92); border: 1px solid var(--border-subtle);
      border-radius: 8px; padding: 0.85rem 1rem; backdrop-filter: blur(8px);
      min-width: 245px; max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .hud-exp-title { font-size: 0.84rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem; }
    .hud-formula {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-secondary);
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
      padding: 0.22rem 0.5rem; border-radius: 4px; margin-bottom: 0.65rem; display: inline-block;
    }
    .hud-metric {
      display: flex; justify-content: space-between; font-size: 0.76rem;
      margin-bottom: 0.3rem; color: var(--text-secondary); gap: 0.75rem;
    }
    .hud-metric:last-child { margin-bottom: 0; }
    .hud-metric strong {
      font-family: 'JetBrains Mono', monospace; color: var(--text-primary); font-weight: 500;
    }

    /* CONTROLES CONTEXTUALES EN EL LIENZO */
    .cam-controls {
      position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
      display: flex; gap: 0.4rem; background: rgba(18, 21, 29, 0.92);
      border: 1px solid var(--border-subtle); padding: 0.35rem; border-radius: 8px;
      backdrop-filter: blur(8px); z-index: 10;
    }
    .btn-ctrl {
      background: transparent; border: 1px solid transparent;
      color: var(--text-secondary); font-size: 0.76rem; font-weight: 500;
      padding: 0.38rem 0.75rem; border-radius: 6px; cursor: pointer; transition: all 0.15s;
    }
    .btn-ctrl:hover { color: var(--text-primary); background: var(--bg-elevated); }
    .btn-ctrl.active { background: var(--accent-primary); color: #fff; }

    /* PANEL LATERAL DE PARÁMETROS */
    .side-drawer {
      background: var(--bg-surface); border-left: 1px solid var(--border-subtle);
      padding: 1.1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.1rem; z-index: 15;
    }
    @media (max-width: 860px) {
      .side-drawer {
        border-left: none; border-top: 1px solid var(--border-subtle);
        max-height: 44vh; padding: 0.9rem;
      }
    }

    .drawer-section {
      border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;
    }
    .drawer-section:last-child { border-bottom: none; padding-bottom: 0; }
    .drawer-title {
      font-size: 0.74rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 0.75rem;
    }

    .param-item { margin-bottom: 0.85rem; }
    .param-item:last-child { margin-bottom: 0; }
    .param-head { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.35rem; color: var(--text-primary); }
    .param-head span:last-child { font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); font-size: 0.76rem; }
    input[type="range"] {
      width: 100%; -webkit-appearance: none; background: #262b3a;
      height: 5px; border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
      background: var(--accent-primary); cursor: pointer; border: 2px solid #fff;
    }

    /* SELECTOR E INPUT DE FUNCIONES 3D */
    .formula-box {
      display: none; flex-direction: column; gap: 0.55rem; margin-bottom: 1rem;
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      padding: 0.75rem; border-radius: 6px;
    }
    .formula-select, .formula-input {
      width: 100%; background: var(--bg-app); border: 1px solid var(--border-subtle);
      color: var(--text-primary); font-size: 0.78rem; padding: 0.48rem 0.6rem;
      border-radius: 5px; outline: none;
    }
    .formula-input { font-family: 'JetBrains Mono', monospace; }
    .formula-select:focus, .formula-input:focus { border-color: var(--accent-primary); }

    .preset-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
    .btn-preset {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      color: var(--text-secondary); font-size: 0.74rem; padding: 0.45rem 0.5rem;
      border-radius: 5px; cursor: pointer; text-align: left; transition: all 0.15s;
    }
    .btn-preset:hover { border-color: var(--border-focus); color: var(--text-primary); }

    .toast-sync {
      position: fixed; top: 4.2rem; right: 1rem; background: var(--bg-elevated);
      border: 1px solid var(--border-focus); color: var(--text-primary);
      font-size: 0.75rem; font-weight: 500; padding: 0.45rem 0.85rem;
      border-radius: 6px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
  </style>
</head>
<body>

  <div class="toast-sync" id="toast-sync">Sincronizado con el docente</div>

  <header>
    <a href="index.html" class="brand">
      <div class="logo-badge">N</div>
      <div>
        <span class="brand-title">VirtualLab</span>
        <span class="brand-sub">Visor 3D de Laboratorio</span>
      </div>
    </a>

    <div class="header-actions">
      <span class="status-badge">● Sala Activa</span>
      <a href="alumno.html?v=rev18_clean" id="link-ar" class="nav-btn">Modo Cámara AR</a>
      <a href="profesor.html" class="nav-btn">Panel Docente</a>
    </div>
  </header>

  <div class="exp-bar" id="exp-bar">
    <button class="exp-pill active" data-id="MEC-01" onclick="selectExperiment('MEC-01')">1. Péndulo Simple</button>
    <button class="exp-pill" data-id="MEC-02" onclick="selectExperiment('MEC-02')">2. Sistema Masa-Resorte</button>
    <button class="exp-pill" data-id="OPT-01" onclick="selectExperiment('OPT-01')">3. Ley de Snell (Óptica)</button>
    <button class="exp-pill" data-id="QC-01" onclick="selectExperiment('QC-01')">4. Estados de Bell (Cuántica)</button>
    <button class="exp-pill" data-id="MAT-01" onclick="selectExperiment('MAT-01')">5. Superficies 3D z = f(x,y)</button>
  </div>

  <div class="workspace">
    <div class="canvas-wrap" id="canvas-wrap">
      <div id="viewer-canvas"></div>

      <div class="hud-card">
        <div class="hud-exp-title" id="hud-title">Péndulo Simple</div>
        <div class="hud-formula" id="hud-formula">T = 2π √(L / g)</div>
        <div id="hud-metrics"></div>
      </div>

      <!-- Barra de transporte contextual: solo muestra botones que aplican al experimento -->
      <div class="cam-controls">
        <button class="btn-ctrl" id="btn-play" onclick="togglePause()">Pausar</button>
        <button class="btn-ctrl" id="btn-push" onclick="triggerPush()">Perturbar</button>
        <button class="btn-ctrl" id="btn-reset" onclick="resetSim()">Reiniciar</button>
        <button class="btn-ctrl" onclick="resetCameraView()">Centrar Vista</button>
      </div>
    </div>

    <aside class="side-drawer">
      <div class="drawer-section">
        <div class="drawer-title">Parámetros del Experimento</div>

        <!-- Catálogo de Funciones de Ejemplo + Editor en Vivo (Solo en MAT-01) -->
        <div class="formula-box" id="formula-box">
          <label style="font-size:0.75rem; color:var(--text-secondary);">Funciones de ejemplo:</label>
          <select id="formula-select" class="formula-select"></select>
          <label style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.2rem;">Expresión matemática z = f(x, y, t, r):</label>
          <input type="text" id="formula-input" class="formula-input" value="A * sin(k * r - w * t) / (1 + 0.35 * r)">
        </div>

        <div id="sliders-container"></div>
      </div>

      <div class="drawer-section">
        <div class="drawer-title">Configuraciones de Referencia</div>
        <div class="preset-wrap" id="presets-container"></div>
      </div>

      <div class="drawer-section">
        <div class="drawer-title">Nota de Interacción</div>
        <p style="font-size:0.76rem; color:var(--text-secondary); line-height:1.5;" id="exp-desc"></p>
      </div>
    </aside>
  </div>

  <script>
    const wrap = document.getElementById('viewer-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d14);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    wrap.appendChild(renderer.domElement);

    // Iluminación neutra de laboratorio (sin luces de neón que distorsionen colores)
    scene.add(new THREE.AmbientLight(0xffffff, 0.95));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.75);
    keyLight.position.set(4, 8, 5);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x94a3b8, 0.35);
    fillLight.position.set(-4, 3, -4);
    scene.add(fillLight);

    // Grilla sobria de referencia
    const gridHelper = new THREE.GridHelper(3.6, 18, 0x334155, 0x1e293b);
    gridHelper.position.y = 0.0;
    scene.add(gridHelper);

    // Cámara Orbital + Manipulación Directa de Objetos con Raycaster
    const camOrbit = {
      theta: 0.32,
      phi: 1.18,
      radius: 2.35,
      target: new THREE.Vector3(0, 0.58, 0),
      isOrbiting: false,
      isDraggingObject: false,
      lastX: 0,
      lastY: 0,
      pinchDist: 0
    };

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersectPt = new THREE.Vector3();

    function updateCameraOrbit() {
      camOrbit.phi = Math.max(0.2, Math.min(Math.PI / 2 - 0.04, camOrbit.phi));
      camOrbit.radius = Math.max(0.9, Math.min(5.0, camOrbit.radius));
      camera.position.x = camOrbit.target.x + camOrbit.radius * Math.sin(camOrbit.phi) * Math.sin(camOrbit.theta);
      camera.position.y = camOrbit.target.y + camOrbit.radius * Math.cos(camOrbit.phi);
      camera.position.z = camOrbit.target.z + camOrbit.radius * Math.sin(camOrbit.phi) * Math.cos(camOrbit.theta);
      camera.lookAt(camOrbit.target);
    }

    function resetCameraView() {
      camOrbit.theta = 0.32;
      camOrbit.phi = 1.18;
      camOrbit.radius = 2.35;
      camOrbit.target.set(0, 0.58, 0);
      updateCameraOrbit();
    }
    resetCameraView();

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    const domElem = renderer.domElement;
    domElem.style.touchAction = 'none';

    domElem.addEventListener('pointerdown', (e) => {
      updatePointerNDC(e);
      if (expSceneInstance && expSceneInstance.getInteractiveObjects) {
        const targets = expSceneInstance.getInteractiveObjects();
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(targets, true);
        if (hits.length > 0) {
          camOrbit.isDraggingObject = true;
          expState.isDraggingObject = true;
          domElem.style.cursor = 'grabbing';
          return;
        }
      }
      camOrbit.isOrbiting = true;
      camOrbit.lastX = e.clientX;
      camOrbit.lastY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (camOrbit.isDraggingObject && expSceneInstance && expSceneInstance.onDrag) {
        updatePointerNDC(e);
        raycaster.setFromCamera(pointerNDC, camera);
        if (raycaster.ray.intersectPlane(dragPlane, intersectPt)) {
          const res = expSceneInstance.onDrag(intersectPt, expState, expParams);
          if (res && res.paramChanged) {
            const k = res.paramChanged;
            const sl = document.getElementById(`slider-${k}`);
            const vl = document.getElementById(`val-${k}`);
            const pDef = (currentExp.params || []).find(x => x.key === k);
            if (sl) sl.value = res.value;
            if (vl) vl.innerText = `${res.value} ${pDef ? pDef.unit : ''}`;
          }
          expSceneInstance.update(expState, expParams);
          renderMetricsHUD();
        }
        return;
      }
      if (!camOrbit.isOrbiting) return;
      const dx = e.clientX - camOrbit.lastX;
      const dy = e.clientY - camOrbit.lastY;
      camOrbit.lastX = e.clientX;
      camOrbit.lastY = e.clientY;
      camOrbit.theta -= dx * 0.0075;
      camOrbit.phi -= dy * 0.0075;
      updateCameraOrbit();
    });

    window.addEventListener('pointerup', () => {
      camOrbit.isOrbiting = false;
      camOrbit.isDraggingObject = false;
      if (expState) expState.isDraggingObject = false;
      domElem.style.cursor = 'grab';
    });

    domElem.addEventListener('wheel', (e) => {
      e.preventDefault();
      camOrbit.radius += e.deltaY * 0.0018;
      updateCameraOrbit();
    }, { passive: false });

    function onResize() {
      const container = document.getElementById('canvas-wrap');
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    setTimeout(onResize, 50);

    // Gestor de Experimentos
    let currentExpId = new URLSearchParams(window.location.search).get('exp') || 'MEC-01';
    if (!window.VLabExperiments[currentExpId]) currentExpId = 'MEC-01';

    let currentExp = null;
    let expState = {};
    let expParams = {};
    let expSceneInstance = null;
    let isPaused = false;

    const expRootGroup = new THREE.Group();
    scene.add(expRootGroup);

    function selectExperiment(expId) {
      const expDef = window.VLabExperiments[expId];
      if (!expDef) return;
      currentExpId = expId;
      currentExp = expDef;

      document.querySelectorAll('.exp-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === expId);
      });
      document.getElementById('link-ar').href = `alumno.html?v=rev18_clean&exp=${expId}`;

      expParams = {};
      (expDef.params || []).forEach(p => { expParams[p.key] = p.default; });

      // Mostrar/ocultar controles contextuales (ej. ocultar Impulso y Pausar en Snell)
      const btnPlay = document.getElementById('btn-play');
      const btnPush = document.getElementById('btn-push');
      btnPlay.style.display = expDef.isStaticScene ? 'none' : 'inline-block';
      btnPush.style.display = expDef.hasImpulse ? 'inline-block' : 'none';

      // Poblar lista de funciones de ejemplo en MAT-01
      const fBox = document.getElementById('formula-box');
      if (expDef.hasCustomFormulaInput) {
        expParams.formulaExpr = expDef.defaultFormula;
        fBox.style.display = 'flex';
        document.getElementById('formula-input').value = expDef.defaultFormula;

        const fSelect = document.getElementById('formula-select');
        fSelect.innerHTML = '';
        (expDef.exampleFunctions || []).forEach((fnItem, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = fnItem.name;
          fSelect.appendChild(opt);
        });
        fSelect.onchange = () => {
          const item = expDef.exampleFunctions[fSelect.value];
          if (!item) return;
          expParams.formulaExpr = item.expr;
          document.getElementById('formula-input').value = item.expr;
          if (item.params) {
            Object.keys(item.params).forEach(k => {
              expParams[k] = item.params[k];
              const sl = document.getElementById(`slider-${k}`);
              const vl = document.getElementById(`val-${k}`);
              const pDef = (expDef.params || []).find(x => x.key === k);
              if (sl) sl.value = item.params[k];
              if (vl) vl.innerText = `${item.params[k]} ${pDef ? pDef.unit : ''}`;
            });
          }
          if (expSceneInstance) expSceneInstance.update(expState, expParams);
          renderMetricsHUD();
        };
      } else {
        fBox.style.display = 'none';
      }

      expState = expDef.initState ? expDef.initState(expParams) : { t: 0 };

      while (expRootGroup.children.length > 0) {
        expRootGroup.remove(expRootGroup.children[0]);
      }
      expSceneInstance = expDef.createScene(THREE, window.VLabComponents, expParams);
      expRootGroup.add(expSceneInstance.group);
      expSceneInstance.update(expState, expParams);

      document.getElementById('hud-title').innerText = expDef.title;
      document.getElementById('hud-formula').innerText = expDef.formula;
      document.getElementById('exp-desc').innerText = expDef.description;

      buildSlidersUI(expDef);
      buildPresetsUI(expDef);
      renderMetricsHUD();
    }

    function buildSlidersUI(expDef) {
      const container = document.getElementById('sliders-container');
      container.innerHTML = '';
      (expDef.params || []).forEach(p => {
        const row = document.createElement('div');
        row.className = 'param-item';
        row.innerHTML = `
          <div class="param-head">
            <span>${p.label}</span>
            <span id="val-${p.key}">${expParams[p.key]} ${p.unit || ''}</span>
          </div>
          <input type="range" id="slider-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${expParams[p.key]}">
        `;
        container.appendChild(row);
        row.querySelector('input').addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          expParams[p.key] = val;
          document.getElementById(`val-${p.key}`).innerText = `${val} ${p.unit || ''}`;
          if (expSceneInstance) expSceneInstance.update(expState, expParams);
          renderMetricsHUD();
        });
      });
    }

    function buildPresetsUI(expDef) {
      const container = document.getElementById('presets-container');
      container.innerHTML = '';
      (expDef.presets || []).forEach(pr => {
        const btn = document.createElement('button');
        btn.className = 'btn-preset';
        btn.innerText = pr.label;
        btn.onclick = () => {
          Object.keys(pr.values || {}).forEach(k => {
            expParams[k] = pr.values[k];
            const sl = document.getElementById(`slider-${k}`);
            const vl = document.getElementById(`val-${k}`);
            const pDef = (expDef.params || []).find(x => x.key === k);
            if (sl) sl.value = pr.values[k];
            if (vl) vl.innerText = `${pr.values[k]} ${pDef ? pDef.unit : ''}`;
          });
          if (pr.formula) {
            expParams.formulaExpr = pr.formula;
            document.getElementById('formula-input').value = pr.formula;
          }
          if (expSceneInstance) expSceneInstance.update(expState, expParams);
          renderMetricsHUD();
        };
        container.appendChild(btn);
      });
    }

    document.getElementById('formula-input').addEventListener('input', (e) => {
      expParams.formulaExpr = e.target.value;
      if (expSceneInstance) expSceneInstance.update(expState, expParams);
    });

    function renderMetricsHUD() {
      if (!currentExp || !currentExp.getMetrics) return;
      const metrics = currentExp.getMetrics(expState, expParams);
      document.getElementById('hud-metrics').innerHTML = metrics.map(m => `
        <div class="hud-metric"><span>${m.label}</span> <strong>${m.value}</strong></div>
      `).join('');
    }

    function togglePause() {
      isPaused = !isPaused;
      const btn = document.getElementById('btn-play');
      btn.innerText = isPaused ? 'Reanudar' : 'Pausar';
      btn.classList.toggle('active', isPaused);
    }

    function triggerPush() {
      if (currentExp && currentExp.onPush) {
        currentExp.onPush(expState, expParams);
      }
    }

    function resetSim() {
      if (currentExp && currentExp.initState) {
        expState = currentExp.initState(expParams);
      }
      if (expSceneInstance) expSceneInstance.update(expState, expParams);
    }

    // Sincronización con el Profesor vía MQTT
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true });
    client.on('connect', () => {
      client.subscribe('vlab-n/sala-natex');
    });
    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());
        if (payload.type === 'PARAM_CHANGE' || payload.type === 'SYNC') {
          if (payload.expId && payload.expId !== currentExpId && window.VLabExperiments[payload.expId]) {
            selectExperiment(payload.expId);
          }
          if (payload.params) {
            Object.keys(payload.params).forEach(k => {
              expParams[k] = payload.params[k];
              const sl = document.getElementById(`slider-${k}`);
              const vl = document.getElementById(`val-${k}`);
              const pDef = (currentExp.params || []).find(x => x.key === k);
              if (sl) sl.value = payload.params[k];
              if (vl) vl.innerText = `${payload.params[k]} ${pDef ? pDef.unit : ''}`;
            });
            if (payload.params.formulaExpr) {
              document.getElementById('formula-input').value = payload.params.formulaExpr;
            }
          }
          if (payload.paused !== undefined) isPaused = payload.paused;
          if (payload.state && (payload.action === 'RESET' || payload.action === 'PUSH' || payload.action === 'DRAG' || payload.action === 'SYNC_ALL')) {
            Object.assign(expState, payload.state);
          }
        }
      } catch (e) {}
    });

    let lastT = performance.now();
    let frameCounter = 0;
    function animate(now) {
      requestAnimationFrame(animate);
      let dt = (now - lastT) / 1000;
      lastT = now;
      if (dt > 0.1) dt = 0.1;

      if (!isPaused && currentExp && currentExp.step) {
        currentExp.step(expState, expParams, dt);
      }
      if (expSceneInstance && expSceneInstance.update) {
        expSceneInstance.update(expState, expParams);
      }
      if (frameCounter++ % 4 === 0) {
        renderMetricsHUD();
      }
      renderer.render(scene, camera);
    }

    selectExperiment(currentExpId);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
