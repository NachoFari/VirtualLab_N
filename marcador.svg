<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Fondo Blanco de la Hoja -->
  <rect width="1000" height="1000" fill="#ffffff" />
  
  <!-- MARCO NEGRO SÓLIDO OBLIGATORIO DE ARTOOLKIT (PatternRatio 0.5) -->
  <!-- Tamaño exterior: 700x700 centrado en (150, 150) -->
  <rect x="150" y="150" width="700" height="700" fill="#000000" />
  
  <!-- HUECO BLANCO INTERIOR (Exactamente 50% = 350x350 centrado en 325, 325) -->
  <rect x="325" y="325" width="350" height="350" fill="#ffffff" />

  <!-- SÍMBOLOS INTERIORES DE ALTO CONTRASTE -->
  
  <!-- 1. CÍRCULO CON PUNTO (Top-Left) -->
  <circle cx="380" cy="380" r="32" fill="none" stroke="#000000" stroke-width="12" />
  <circle cx="380" cy="380" r="10" fill="#000000" />

  <!-- 2. TRIÁNGULO (Top-Right) -->
  <polygon points="620,348 658,412 582,412" fill="#000000" />

  <!-- 3. DIAMANTE (Bottom-Left) -->
  <polygon points="380,588 416,624 380,660 344,624" fill="#000000" />

  <!-- 4. CUADRADO CON CRUZ (Bottom-Right) -->
  <rect x="590" y="590" width="60" height="60" fill="#000000" />
  <line x1="620" y1="590" x2="620" y2="650" stroke="#ffffff" stroke-width="8" />
  <line x1="590" y1="620" x2="650" y2="620" stroke="#ffffff" stroke-width="8" />

  <!-- 5. GLIFO CENTRAL "N" DE NATEX -->
  <path d="M 445,575 L 445,425 L 485,425 L 515,505 L 515,425 L 555,425 L 555,575 L 515,575 L 485,495 L 485,575 Z" fill="#000000" />

  <!-- TEXTOS PEDAGÓGICOS EXTERIORES -->
  <text x="500" y="100" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" letter-spacing="4" text-anchor="middle" fill="#000000">▲ HACIA LA PIZARRA</text>
  <text x="500" y="910" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="900" letter-spacing="6" text-anchor="middle" fill="#000000">VIRTUALLAB_N</text>
  <text x="500" y="950" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#000000">DIANA ÓPTICA OFICIAL • PATTERN RATIO 0.5</text>
</svg>
