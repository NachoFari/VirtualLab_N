<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Marcador de Referencia AR | VirtualLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f; color: #f1f5f9; font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem; text-align: center;
    }
    .card {
      background: #12151d; border: 1px solid #262b3a; padding: 1.75rem; border-radius: 12px;
      max-width: 520px; width: 100%;
    }
    h1 { font-size: 1.15rem; font-weight: 600; color: #f1f5f9; margin-bottom: 0.4rem; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.25rem; line-height: 1.5; }

    .tab-bar {
      display: flex; gap: 0.45rem; justify-content: center; margin-bottom: 1.25rem;
    }
    .tab-btn {
      background: #1a1e29; border: 1px solid #262b3a; color: #94a3b8;
      font-size: 0.78rem; font-weight: 500; padding: 0.45rem 0.9rem;
      border-radius: 6px; cursor: pointer; transition: all 0.15s;
    }
    .tab-btn.active {
      background: #3b82f6; color: #fff; border-color: #3b82f6;
    }

    .marker-frame {
      background: #ffffff; padding: 2.2rem; border-radius: 10px; display: inline-block; margin-bottom: 1.25rem;
    }
    .marker-img {
      width: 310px; height: 310px; display: block; object-fit: contain;
      image-rendering: pixelated; image-rendering: crisp-edges; margin: 0 auto;
    }

    .size-control {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      margin-bottom: 1.25rem; font-size: 0.78rem; color: #94a3b8;
    }
    .size-control input[type="range"] { width: 150px; accent-color: #3b82f6; }

    .btn-group { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; background: #3b82f6; color: #fff; font-weight: 500;
      padding: 0.6rem 1.1rem; border-radius: 6px; text-decoration: none; font-size: 0.8rem;
    }
    .btn-secondary {
      background: #1a1e29; color: #f1f5f9; border: 1px solid #262b3a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Marcador de Referencia Óptica</h1>
    <p>Muestra este patrón en tu pantalla o imprímelo en papel para proyectar el experimento con la cámara del dispositivo móvil.</p>
    
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-natex" onclick="setMarker('natex')">Patrón N (16×16)</button>
      <button class="tab-btn" id="tab-hiro" onclick="setMarker('hiro')">Patrón Hiro Estándar</button>
    </div>

    <div class="marker-frame" id="frame">
      <img id="marker-img" src="marcador.svg?v=rev18" alt="Marcador AR" class="marker-img">
    </div>

    <div class="size-control">
      <span>Escala en pantalla:</span>
      <input type="range" id="size-slider" min="200" max="460" step="10" value="310" oninput="changeSize(this.value)">
      <span id="size-val" style="font-family:'JetBrains Mono', monospace;">310 px</span>
    </div>

    <div class="btn-group">
      <a href="alumno.html?v=rev18_clean" class="btn">Abrir Cámara AR</a>
      <a id="btn-download" href="marcador.svg?v=rev18" download="marcador_VirtualLab.svg" class="btn btn-secondary">Descargar SVG</a>
      <a href="index.html" class="btn btn-secondary">Volver al Inicio</a>
    </div>
  </div>

  <script>
    function setMarker(type) {
      const img = document.getElementById('marker-img');
      const tabNatex = document.getElementById('tab-natex');
      const tabHiro = document.getElementById('tab-hiro');
      const btnDl = document.getElementById('btn-download');

      if (type === 'natex') {
        img.src = 'marcador.svg?v=rev18';
        btnDl.href = 'marcador.svg?v=rev18';
        btnDl.download = 'marcador_VirtualLab.svg';
        tabNatex.classList.add('active');
        tabHiro.classList.remove('active');
      } else {
        img.src = 'marcador_hiro.png?v=rev18';
        btnDl.href = 'marcador_hiro.png?v=rev18';
        btnDl.download = 'marcador_hiro.png';
        tabHiro.classList.add('active');
        tabNatex.classList.remove('active');
      }
    }

    function changeSize(val) {
      const img = document.getElementById('marker-img');
      img.style.width = val + 'px';
      img.style.height = val + 'px';
      document.getElementById('size-val').innerText = val + ' px';
    }
  </script>
</body>
</html>
